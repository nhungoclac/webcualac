<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webcualac</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Ambient Glow Effects -->
    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>

    <!-- Header & Navigation -->
    <header class="site-header">
      <div class="nav-container">
        <a href="index.html" class="brand-logo">
          <img src="favicon.svg" alt="Logo" class="brand-logo-img" style="width: 36px; height: 36px; object-fit: contain;" />
          <span class="brand-text">LacNgocNhu</span>
        </a>

        <nav class="main-nav" id="mainNav">
          <a href="index.html" class="nav-link"
            ><i class="fas fa-home"></i> Trang chủ</a
          >
          <a href="album.html" class="nav-link active"
            ><i class="fas fa-images"></i> Album ảnh</a
          >
          <a href="contact.html" class="nav-link"
            ><i class="fas fa-paper-plane"></i> Liên hệ</a
          >
        </nav>

        <div class="nav-actions">
          <!-- Mobile Hamburger Menu Button -->
          <button
            class="btn-icon mobile-menu-btn"
            id="mobileMenuBtn"
            title="Menu Điều Hướng"
            aria-label="Menu"
          >
            <i class="fas fa-bars" id="mobileMenuIcon"></i>
          </button>

          <!-- Dark / Light Theme Toggle -->
          <button
            class="btn-icon"
            id="themeToggle"
            title="Đổi giao diện Sáng / Tối"
          >
            <i class="fas fa-moon" id="themeIcon"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="container">
      <section class="card full-width" style="margin-bottom: 24px">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
          "
        >
          <div>
            <h1 class="card-title" style="margin-bottom: 6px">
              <i class="fas fa-camera-retro"></i> Khoảnh Khắc & Hành Trình Kỷ
              Niệm
            </h1>
            <p style="color: var(--text-sub); font-size: 0.95rem">
              Những hình ảnh lưu giữ kỷ niệm hoạt động sinh viên, chuyến đi thực
              tế và trải nghiệm đáng nhớ 🌸
            </p>
          </div>
          <div
            class="badge badge-tech"
            style="font-size: 0.9rem; padding: 8px 16px"
          >
            <i class="fas fa-images"></i> Total: 9 Moments
          </div>
        </div>
      </section>

      <!-- Filter Buttons & Gallery Section -->
      <section class="card full-width">
        <div class="album-controls">
          <button class="filter-btn active" data-filter="all">
            <i class="fas fa-th"></i> Tất Cả (9)
          </button>
          <button class="filter-btn" data-filter="hoatdong">
            <i class="fas fa-hands-helping"></i> Hoạt Động & Xã Hội
          </button>
          <button class="filter-btn" data-filter="dulich">
            <i class="fas fa-plane-departure"></i> Du Lịch & Trải Nghiệm
          </button>
          <button class="filter-btn" data-filter="kyniem">
            <i class="fas fa-shield-alt"></i> Kỷ Niệm Quân Sự
          </button>
        </div>

        <!-- Photo Grid -->
        <div class="album-grid" id="albumGrid">
          <!-- Rendered dynamically by script.js -->
        </div>
      </section>
    </main>

    <!-- Lightbox Modal -->
    <div id="imageModal" class="modal">
      <span class="modal-close" id="modalCloseBtn">&times;</span>
      <button class="modal-nav-btn modal-prev" id="modalPrevBtn">
        <i class="fas fa-chevron-left"></i>
      </button>
      <img class="modal-content" id="modalImage" alt="Gallery detail view" />
      <button class="modal-nav-btn modal-next" id="modalNextBtn">
        <i class="fas fa-chevron-right"></i>
      </button>
      <div id="modalCaption" class="modal-caption"></div>
    </div>

    <!-- Tawk.to Widget Script (Chatbot từ lacprofile) -->
    <script type="text/javascript">
      var Tawk_API = Tawk_API || {},
        Tawk_LoadStart = new Date();
      (function () {
        var s1 = document.createElement("script"),
          s0 = document.getElementsByTagName("script")[0];
        s1.async = true;
        s1.src = "https://embed.tawk.to/66f86534e5982d6c7bb61f6a/1i8t4mm94";
        s1.charset = "UTF-8";
        s1.setAttribute("crossorigin", "*");
        s0.parentNode.insertBefore(s1, s0);
      })();
    </script>

    <!-- Script -->
    <script src="script.js"></script>
  </body>
</html>
